{% extends "base.html" %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="card auth-card">
    <h1>Créer un compte</h1>
    <p class="muted">Quelques secondes suffisent. Vous choisirez ensuite vos centres d'intérêt.</p>
    <form method="post" class="form">
      <label>Nom d'utilisateur
        <input name="username" required minlength="3" autocomplete="username">
      </label>
      <label>E-mail
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label>Mot de passe
        <input type="password" name="password" required minlength="6" autocomplete="new-password">
      </label>
      <label>Confirmer le mot de passe
        <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
      </label>
      <button class="btn btn-primary btn-block" type="submit">Créer mon compte</button>
    </form>
    <p class="muted center">Déjà inscrit ? <a href="{{ url_for('main.login') }}">Se connecter</a></p>
  </div>
</section>
{% endblock %}
